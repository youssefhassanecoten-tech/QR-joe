name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Repository guards (encoding, versions, no private ic files, no APKs in git)
        run: npm run guard

      - name: Build web app
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Android 36 platform
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | sort | tail -1)"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36"

      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QR-JOE-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
