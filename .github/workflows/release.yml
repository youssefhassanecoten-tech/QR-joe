name: Publish release

# Builds the APK, creates the GitHub release with the asset, refreshes qrjoe-update.json
# (so every installed app gets the in-app update banner) and pushes the feed commit.
# Run manually from the Actions tab, or push a tag like v4.5.0.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Repository guards
        run: npm run guard

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Android 36 platform
        run: sdkmanager --install "platforms;android-36"

      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/QR-JOE.apk

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release, upload APK, refresh update feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
