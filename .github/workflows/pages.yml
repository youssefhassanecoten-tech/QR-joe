name: Pages

# Publishes the built web app to GitHub Pages:
# https://youssefhassanecoten-tech.github.io/QR-joe/
# Activates automatically once Settings -> Pages -> Source is "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Pages source mode
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages source is not set to GitHub Actions - skipping deploy. Enable it in Settings -> Pages."
          fi

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.mode.outputs.enabled == 'true'
        run: npm ci

      - name: Build for the /QR-joe/ subpath
        if: steps.mode.outputs.enabled == 'true'
        run: npm run build -- --base=/QR-joe/

      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.enabled == 'true'
        with:
          path: dist

      - id: deployment
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
